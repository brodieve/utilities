# Generate Parking.xcodeproj with XcodeGen: brew install xcodegen && xcodegen
name: Parking
options:
  bundleIdPrefix: io.github.brodieve
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Apple developer team, for signing on a device and for TestFlight.
    DEVELOPMENT_TEAM: 75V83JVZWU
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Parking:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Parking
        excludes:
          - pass10x.js
      - path: Parking/pass10x.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.brodieve.Parking
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parking
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # HTTPS only, through WKWebView: exempt, so TestFlight skips the question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
