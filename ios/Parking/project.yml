# Generate Parking.xcodeproj with XcodeGen: brew install xcodegen && xcodegen
name: Parking
options:
  bundleIdPrefix: io.github.brodieve
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Your Apple developer team, for signing on a device.
    DEVELOPMENT_TEAM: ""
targets:
  GuestPass:
    type: application
    platform: iOS
    sources:
      - path: Parking
        excludes:
          - pass10x.js
      - path: Parking/pass10x.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.brodieve.Parking
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parking
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
